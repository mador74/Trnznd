<div class="mock" role="img" aria-label="Illustrative convert panel: converting 2,250,000 USDT to USDC within the user's own exchange account, subject to a three-of-five approval policy. Fictional data.">
  <div class="mock__bar" aria-hidden="true">
    <div class="mock__dots"><i></i><i></i><i></i></div>
    <div class="mock__title">{{icon:convert}} Trade &amp; convert</div>
    <span class="mock__fiction">Illustrative data</span>
  </div>
  <div class="mock__body" aria-hidden="true">
    <div class="mock__tabs"><span class="on">Convert</span><span>Buy</span><span>Sell</span></div>
    <div class="mock__label" style="margin-bottom:6px">Account</div>
    <div class="mock__field"><span class="mock__name">{{icon:exchange}}</span><span style="flex:1" class="mock__name">Exchange account A</span><span class="mock__meta">your account</span></div>
    <div class="mock__field"><span><span class="mock__label">From</span><br><b class="num">2,250,000.00</b></span><span class="chip">USDT</span></div>
    <div class="mock__field"><span><span class="mock__label">To (indicative quote from your exchange)</span><br><b class="num">≈ 2,249,550.00</b></span><span class="chip">USDC</span></div>
    <dl class="kv" style="margin:12px 0 14px">
      <dt>Policy</dt><dd>Trades over $500k · 3 of 5</dd>
      <dt>Executed by</dt><dd>Exchange account A</dd>
    </dl>
    <span class="mock-btn mock-btn--primary" style="width:100%;justify-content:center;height:38px">Submit for approval</span>
  </div>
</div>
