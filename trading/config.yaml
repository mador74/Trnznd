# Configuration for the crypto research/backtest pipeline.
# This project is RESEARCH + BACKTEST ONLY — it never places real orders.

data:
  symbol: BTCUSDT        # Binance trading pair
  interval: 1h           # candle interval: 1m,5m,15m,1h,4h,1d ...
  limit: 6000            # number of most-recent candles to fetch
  cache_dir: data        # local cache for downloaded candles

label:
  horizon: 1             # predict return this many candles ahead
  # A bar is labeled "up" (1) if forward return exceeds `deadband`, else 0.
  # deadband roughly filters out noise smaller than trading costs.
  deadband: 0.0

model:
  type: gradient_boosting   # gradient_boosting | logistic
  n_estimators: 200
  max_depth: 3
  learning_rate: 0.05
  random_state: 42

backtest:
  # Walk-forward: train on a rolling/expanding window, test out-of-sample.
  train_size: 2000       # candles used to fit before first prediction
  step: 250              # refit cadence (candles) for walk-forward
  fee_bps: 10.0          # per-side taker fee in basis points (0.10%)
  slippage_bps: 2.0      # per-side slippage assumption in basis points
  allow_short: false     # long/flat if false; long/short if true
  prob_threshold: 0.5    # go long when P(up) > threshold
