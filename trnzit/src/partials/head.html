<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="{{robots}}">
<link rel="canonical" href="{{canonical}}">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
<link rel="preload" href="{{root}}assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}assets/css/trnzit.min.css">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Trnzit">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{ogimage}}">
<meta name="twitter:card" content="summary_large_image">
<script>document.documentElement.classList.add('js')</script>
<script src="{{root}}assets/js/site.js" defer></script>
</head>
<body class="{{bodyclass}}">
<a class="skip-link" href="#main">Skip to content</a>
{{logo-defs}}
<div class="brand-rule" aria-hidden="true"></div>
<nav class="group-bar" aria-label="Trnznd Group"><div class="container group-bar__inner"><a href="{{group}}">{{icon:arrow-left}} Back to trnznd.io</a><span>Trnzit is a Trnznd Group product</span></div></nav>
